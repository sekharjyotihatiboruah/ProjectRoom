<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Room</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div>
        <h1>Project Room</h1>
        <p>Shared project workspace</p>
      </div>

      <div class="online">
        <span></span> Live
      </div>
    </header>

    <main>

      <section class="chat-area">

        <div id="messages" class="messages">
          <div class="welcome">
            <h2>Welcome to Project Room 👋</h2>
            <p>Start brainstorming with your team.</p>
          </div>
        </div>

        <div class="typing-area">

          <input
            type="text"
            id="name"
            placeholder="Your name"
            maxlength="30"
          >

          <input
            type="text"
            id="messageInput"
            placeholder="Write your project idea..."
            autocomplete="off"
          >

          <button id="sendButton">Send</button>

        </div>

      </section>

      <aside>

        <h2>Project</h2>

        <input
          type="text"
          id="projectName"
          value="My Project"
        >

        <div class="room-info">
          <p>ROOM</p>
          <strong id="roomId"></strong>
        </div>

        <button id="copyRoom" class="copy">
          Copy Room Link
        </button>

        <h3>Team</h3>

        <div id="members">
          <div class="member">👤 You</div>
        </div>

      </aside>

    </main>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
